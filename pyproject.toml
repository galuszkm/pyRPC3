[project]
name = "pyRPC3"
authors = [{ name = "Michal Galuszka" }]
version = "1.0.1"
description = "Python library for reading and writing RPC3 files"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "numpy>=2.2.5",
    "matplotlib>=3.10.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyRPC3"]

# ---------------------------------------------------------------------------
# DEPENDENCY GROUPS
# ---------------------------------------------------------------------------

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.1",
    "rust-just>=1.46.0",
    "ty>=0.0.17",
    "detect-secrets>=1.5.0",
]
commit = ["commitizen>=4.13.8", "pre-commit>=4.5.1"]

# ---------------------------------------------------------------------------
# TOOL CONFIGURATIONS
# ---------------------------------------------------------------------------

# -- Ruff (linter + formatter) --

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["pyRPC3"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S"]

# -- ty (type checker) --

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
invalid-argument-type = "warn"
invalid-assignment = "warn"
unsupported-operator = "warn"

# -- Pytest --

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
norecursedirs = ["__pycache__", ".git", ".venv"]
addopts = ["-v", "--tb=short"]

# -- Coverage --

[tool.coverage.run]
source = ["src/pyRPC3"]
omit = ["*/tests/*", "*/__pycache__/*", "*/.venv/*", "*/__init__.py"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false

# -- Commitizen --

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
version_files = [
    "pyproject.toml:^version",
]
tag_format = "v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
changelog_incremental = true
