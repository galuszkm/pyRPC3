name: Bug Report
description: Report a bug in pyRPC3
title: "[BUG] "
labels: ["bug", "triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report for pyRPC3!

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I have updated to the latest version of pyRPC3
          required: true
        - label: I have checked the documentation and this is not expected behavior
          required: true
        - label: I have searched [existing issues](https://github.com/galuszkm/pyRPC3/issues) and there are no duplicates
          required: true

  - type: input
    id: pyrpc3-version
    attributes:
      label: pyRPC3 Version
      description: Which version of pyRPC3 are you using?
      placeholder: e.g., 1.0.1
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python Version
      description: Which version of Python are you using?
      placeholder: e.g., 3.11.5
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      description: Which operating system are you using?
      placeholder: e.g., Ubuntu 22.04 / Windows 11 / macOS 14
    validations:
      required: true

  - type: dropdown
    id: installation-method
    attributes:
      label: Installation Method
      description: How did you install pyRPC3?
      options:
        - pip (from GitHub)
        - uv
        - git clone
        - other
    validations:
      required: true

  - type: textarea
    id: file-info
    attributes:
      label: RPC3 File Info
      description: If relevant, describe the RPC3/RSP file you are working with (format, number of channels, file size, etc.)

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior
      placeholder: |
        1. Load the file with RPC3(...)
        2. Call method...
        3. See error...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually happened — include full traceback if applicable
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other relevant information, logs, screenshots, etc.

  - type: textarea
    id: possible-solution
    attributes:
      label: Possible Solution
      description: Optional — if you have suggestions on how to fix the bug
